# ============================================================
# Cấu hình kênh "Thế giới qua con số"
# Đổi nguồn / trọng số ở đây, KHÔNG cần sửa code.
# ============================================================

# ---------- Engine dựng hình (Du chốt 16/11/2026: dùng hình mới) ----------
render:
  engine: web          # web = Remotion (render-web/), manim = engine cũ. Web lỗi thì tự lùi về manim.
  web_concurrency: 3   # số tab Chrome render song song (VM 4 OCPU: để 3, chừa 1 cho dịch vụ khác)

channel:
  name: "Thế giới qua con số"
  language: vi
  description: >
    Kênh giải thích thế giới bằng dữ liệu: biểu đồ động, bản đồ,
    cuộc đua số liệu dựng bằng code. Chủ đề trải rộng: khí hậu, năng lượng, thực phẩm,
    công nghệ, đời sống, kinh tế của cả thế giới; Việt Nam (và Hàn Quốc khi hợp) là điểm
    neo để người xem Việt so với mình.
  video_seconds_min: 60
  video_seconds_max: 90

# ---------- Nguồn ý tưởng (lớp 1: lấy từ nguồn gốc) ----------
sources:
  rss:
    - name: "OWID Data Insights"
      url: "https://ourworldindata.org/atom-data-insights.xml"
      lang: en
      weight: 3          # nguồn hợp chủ đề nhất thì weight cao
    - name: "ScienceDaily Top"
      url: "https://www.sciencedaily.com/rss/top/science.xml"
      lang: en
      weight: 2
    - name: "ScienceDaily All"
      url: "https://www.sciencedaily.com/rss/all.xml"
      lang: en
      weight: 1
    - name: "Hankyoreh Science (Hàn)"
      url: "https://www.hani.co.kr/rss/science/"
      lang: ko
      weight: 2          # nguồn tiếng Hàn ít kênh Việt khai thác
    - name: "Donga Science (Hàn)"
      url: "https://rss.donga.com/science.xml"
      lang: ko
      weight: 2

  arxiv:
    categories: ["econ.GN", "physics.soc-ph", "cs.CY"]   # kinh tế, xã hội định lượng
    max_results: 15

  # Kho dữ liệu mở World Bank (không cần key): mỗi chỉ số thành một ý tưởng "Việt Nam –
  # Hàn Quốc qua một con số", phần tóm tắt là bảng số liệu thật qua các năm.
  # Mã chỉ số tra tại https://data.worldbank.org/indicator — thêm dòng là có ý tưởng mới.
  worldbank:
    per_day: 1            # mỗi ngày đưa vào kho bấy nhiêu chỉ số (xoay vòng theo ngày). Từ 18/11
                          # còn 1 (trước là 2): kho ngập ý tưởng Việt–Hàn, nhường chỗ cho `owid`
    start_year: 1960
    countries:            # hai nước đem ra so; nước đầu là "ta", nước sau là mốc so sánh
      - {iso3: VNM, iso2: VN, name: "Việt Nam"}
      - {iso3: KOR, iso2: KR, name: "Hàn Quốc"}
    indicators:
      - {code: NY.GDP.PCAP.CD,       name: "GDP bình quân đầu người",                    unit: "USD"}
      - {code: SP.DYN.TFRT.IN,       name: "Tổng tỷ suất sinh",                          unit: "con mỗi phụ nữ"}
      - {code: SP.DYN.LE00.IN,       name: "Tuổi thọ trung bình",                        unit: "tuổi"}
      - {code: SP.POP.65UP.TO.ZS,    name: "Tỷ lệ dân số từ 65 tuổi trở lên",            unit: "%"}
      - {code: IT.NET.USER.ZS,       name: "Tỷ lệ người dùng Internet",                  unit: "%"}
      - {code: SP.URB.TOTL.IN.ZS,    name: "Tỷ lệ dân số sống ở thành thị",              unit: "%"}
      - {code: NE.EXP.GNFS.ZS,       name: "Xuất khẩu so với GDP",                       unit: "% GDP"}
      - {code: SL.UEM.TOTL.ZS,       name: "Tỷ lệ thất nghiệp",                          unit: "%"}
      - {code: SE.XPD.TOTL.GD.ZS,    name: "Chi tiêu công cho giáo dục so với GDP",      unit: "% GDP"}
      - {code: SH.XPD.CHEX.GD.ZS,    name: "Chi tiêu y tế so với GDP",                   unit: "% GDP"}
      - {code: GB.XPD.RSDV.GD.ZS,    name: "Chi cho nghiên cứu và phát triển so với GDP", unit: "% GDP"}
      - {code: SP.POP.TOTL,          name: "Dân số",                                     unit: "triệu người", scale: 1000000}
      - {code: NY.GDP.MKTP.KD.ZG,    name: "Tăng trưởng GDP hằng năm",                   unit: "%"}
      - {code: SL.TLF.CACT.FE.ZS,    name: "Tỷ lệ phụ nữ tham gia lực lượng lao động",   unit: "%"}
      - {code: EG.USE.ELEC.KH.PC,    name: "Điện tiêu thụ bình quân đầu người",          unit: "kWh"}
      - {code: SP.DYN.IMRT.IN,       name: "Tỷ suất tử vong trẻ dưới 1 tuổi",            unit: "trên 1.000 trẻ sinh ra"}
      - {code: FP.CPI.TOTL.ZG,       name: "Lạm phát giá tiêu dùng",                     unit: "%"}
      - {code: BX.KLT.DINV.WD.GD.ZS, name: "Vốn FDI vào so với GDP",                     unit: "% GDP"}
      - {code: NY.GDP.MKTP.CD,       name: "Quy mô GDP",                                 unit: "tỷ USD", scale: 1000000000}
      - {code: SP.DYN.CBRT.IN,       name: "Tỷ suất sinh thô",                           unit: "trên 1.000 dân"}
      - {code: AG.LND.FRST.ZS,       name: "Tỷ lệ che phủ rừng",                         unit: "% diện tích"}
      - {code: IT.CEL.SETS.P2,       name: "Thuê bao di động trên 100 dân",              unit: "thuê bao"}
      - {code: SE.TER.ENRR,          name: "Tỷ lệ nhập học đại học",                     unit: "%"}
      - {code: NV.IND.MANF.ZS,       name: "Công nghiệp chế biến chế tạo so với GDP",    unit: "% GDP"}
      - {code: SL.AGR.EMPL.ZS,       name: "Tỷ lệ lao động làm nông nghiệp",             unit: "%"}
    # "Cuộc đua số liệu": nhiều nền kinh tế châu Á xếp hạng qua các năm (thanh ngang đổi chỗ).
    # Tối đa 10 nước để vừa khung dọc.
    races:
      per_day: 1
      start_year: 1990
      year_step: 5          # mốc năm của cuộc đua (kèm năm đầu và năm cuối)
      focus: [VNM, KOR]     # nước được kể kỹ trong tóm tắt (hạng, vượt ai)
      countries:
        - {iso3: VNM, iso2: VN, name: "Việt Nam"}
        - {iso3: KOR, iso2: KR, name: "Hàn Quốc"}
        - {iso3: JPN, iso2: JP, name: "Nhật Bản"}
        - {iso3: CHN, iso2: CN, name: "Trung Quốc"}
        - {iso3: THA, iso2: TH, name: "Thái Lan"}
        - {iso3: MYS, iso2: MY, name: "Malaysia"}
        - {iso3: IDN, iso2: ID, name: "Indonesia"}
        - {iso3: PHL, iso2: PH, name: "Philippines"}
        - {iso3: IND, iso2: IN, name: "Ấn Độ"}
        - {iso3: SGP, iso2: SG, name: "Singapore"}
      indicators:
        - {code: NY.GDP.PCAP.CD,    name: "GDP bình quân đầu người",          unit: "USD"}
        - {code: SP.DYN.LE00.IN,    name: "Tuổi thọ trung bình",              unit: "tuổi"}
        - {code: IT.NET.USER.ZS,    name: "Tỷ lệ người dùng Internet",        unit: "%", start_year: 2000}
        - {code: EG.USE.ELEC.KH.PC, name: "Điện tiêu thụ bình quân đầu người", unit: "kWh"}
        - {code: NY.GDP.MKTP.CD,    name: "Quy mô GDP",                       unit: "tỷ USD", scale: 1000000000}
        - {code: SP.URB.TOTL.IN.ZS, name: "Tỷ lệ dân số sống ở thành thị",    unit: "%"}
        - {code: NE.EXP.GNFS.ZS,    name: "Xuất khẩu so với GDP",             unit: "% GDP"}
    # "Bản đồ thế giới": một chỉ số của mọi nước trong cùng một năm -> Việt Nam đứng thứ mấy,
    # ai cao nhất/thấp nhất, bản đồ thế giới tô màu. Tên/đơn vị lấy từ `indicators` ở trên theo mã.
    world:
      per_day: 1
      start_year: 1990      # chuỗi năm của Việt Nam, Hàn Quốc (vẽ thêm biểu đồ đường)
      focus: [VNM, KOR]
      indicators: [SP.DYN.LE00.IN, NY.GDP.PCAP.CD, SP.DYN.TFRT.IN, IT.NET.USER.ZS,
                   SP.POP.65UP.TO.ZS, SP.URB.TOTL.IN.ZS, EG.USE.ELEC.KH.PC, SP.DYN.IMRT.IN,
                   AG.LND.FRST.ZS, SL.AGR.EMPL.ZS, SL.TLF.CACT.FE.ZS, SH.XPD.CHEX.GD.ZS]

  # KOSIS — cổng thống kê quốc gia Hàn Quốc (cần KOSIS_API_KEY trong .env, không có thì bỏ qua).
  # Mỗi ngày đưa vào `per_day` bảng, xoay vòng. kind: nationality_race | vietnam_by_category
  # (src/sources/kosis.py). Tra bảng mới: kosis.kr -> tìm, lấy orgId/tblId trên trang bảng.
  kosis:
    per_day: 1
    tables:
      - {kind: nationality_race, org: "111", tbl: DT_1B040A7, start: 2010, top: 10,
         org_name: "Bộ Tư pháp Hàn Quốc", unit: "người", focus: ["Việt Nam"],
         name: "Người nước ngoài đăng ký cư trú tại Hàn Quốc"}
      - {kind: vietnam_by_category, org: "111", tbl: DT_1B040A5A, start: 2013, top: 8,
         org_name: "Bộ Tư pháp Hàn Quốc", unit: "người",
         name: "Người Việt Nam cư trú tại Hàn Quốc theo loại visa"}

  # Our World in Data (không cần key, giấy phép CC BY 4.0 — mô tả video tự ghi "Nguồn: Our World
  # in Data — link"). Chủ đề THẾ GIỚI ngoài kinh tế vĩ mô Việt–Hàn (Du xin thêm chủ đề 18/11/2026).
  # Mỗi ngày `per_day` biểu đồ, xoay vòng. Thêm dòng là có ý tưởng mới:
  #   slug   = phần cuối link https://ourworldindata.org/grapher/<slug>
  #   kind   = map (bản đồ thế giới, cần ≥ 100 nước có số) | race (cuộc đua thanh ngang)
  #   group  = (race) top: 10 nước dẫn đầu (+ Việt Nam), hợp với số TỔNG
  #            hoặc tên nhóm trong `groups` (danh sách cố định), hợp với số BÌNH QUÂN
  #   scale  = hệ số chia cho đơn vị (vd 1000000 -> "triệu tấn"); origin = nguồn gốc số liệu
  # Thứ tự xen kẽ chủ đề và dạng hình: mỗi ngày lấy 2 dòng liền nhau.
  owid:
    per_day: 2
    focus: [VNM]          # nước được kể kỹ (hạng, chuỗi theo năm) — chỉ Việt Nam, KHÔNG kèm Hàn Quốc
    groups:
      major: [USA, CHN, JPN, DEU, GBR, FRA, IND, BRA, KOR, VNM]
    charts:
      - {slug: co-emissions-per-capita, kind: map, name: "Lượng CO2 thải ra bình quân mỗi người",
         unit: "tấn", origin: "Global Carbon Budget"}
      - {slug: electric-car-sales-share, kind: race, group: major, start_year: 2015, year_step: 2,
         name: "Tỷ lệ ô tô điện trong số xe mới bán", unit: "%", origin: "Cơ quan Năng lượng Quốc tế (IEA)"}
      - {slug: meat-supply-per-person, kind: map, name: "Lượng thịt bình quân mỗi người một năm",
         unit: "kg", origin: "FAO"}
      - {slug: annual-working-hours-per-worker, kind: race, group: major,
         name: "Số giờ làm việc mỗi năm của một người lao động", unit: "giờ", origin: "Penn World Table"}
      - {slug: share-electricity-renewables, kind: map, name: "Tỷ lệ điện từ năng lượng tái tạo",
         unit: "%", origin: "Ember, Energy Institute"}
      - {slug: coffee-bean-production, kind: race, group: top, scale: 1000,
         name: "Sản lượng cà phê", unit: "nghìn tấn", origin: "FAO"}
      - {slug: median-age, kind: map, name: "Tuổi trung vị của dân số", unit: "tuổi",
         origin: "Liên Hợp Quốc (World Population Prospects)"}
      - {slug: installed-solar-pv-capacity, kind: race, group: top, start_year: 2010,
         name: "Công suất điện mặt trời đã lắp đặt", unit: "GW", origin: "IRENA"}
      - {slug: fish-and-seafood-consumption-per-capita, kind: map,
         name: "Lượng cá và hải sản bình quân mỗi người một năm", unit: "kg", origin: "FAO"}
      - {slug: annual-co2-emissions-per-country, kind: race, group: top, scale: 1000000,
         name: "Lượng CO2 thải ra mỗi năm", unit: "triệu tấn", origin: "Global Carbon Budget"}
      - {slug: total-alcohol-consumption-per-capita-litres-of-pure-alcohol, kind: map,
         name: "Lượng rượu bia bình quân mỗi người từ 15 tuổi", unit: "lít cồn nguyên chất",
         origin: "Tổ chức Y tế Thế giới (WHO)"}
      - {slug: per-capita-energy-use, kind: race, group: major,
         name: "Năng lượng tiêu thụ bình quân mỗi người", unit: "kWh", origin: "Energy Institute"}
      - {slug: pm25-air-pollution, kind: map, name: "Nồng độ bụi mịn PM2.5 trung bình ngoài trời",
         unit: "microgam/m³", origin: "Đại học Washington ở St. Louis"}
      - {slug: rice-production, kind: race, group: top, scale: 1000000,
         name: "Sản lượng lúa gạo", unit: "triệu tấn", origin: "FAO"}
      - {slug: share-of-adults-who-smoke, kind: map, name: "Tỷ lệ người trưởng thành hút thuốc",
         unit: "%", origin: "Tổ chức Y tế Thế giới (WHO)"}
      - {slug: daily-per-capita-caloric-supply, kind: map, name: "Lượng calo bình quân mỗi người một ngày",
         unit: "kcal", origin: "FAO"}
      - {slug: share-electricity-coal, kind: map, name: "Tỷ lệ điện từ than", unit: "%",
         origin: "Ember, Energy Institute"}

  # Reddit chặn đường JSON công khai (403) với nhiều IP, nhất là IP đám mây của VM;
  # src/sources/reddit.py tự chuyển sang đường RSS (vẫn vào được, không cần key).
  reddit:
    subreddits: ["askscience", "explainlikeimfive", "dataisbeautiful"]
    listing: "top"
    time: "day"
    limit: 20

# ---------- Lớp 2: kiểm tra trùng ----------
dedup:
  title_similarity_threshold: 0.55   # trùng >55% từ khóa với ý tưởng cũ -> loại
  youtube_check:                     # cần YOUTUBE_API_KEY, không có thì bỏ qua
    max_results: 10
    high_view_threshold: 100000      # đã có video tiếng Việt >100k view -> phải có góc mới
    max_popular_allowed: 2

# ---------- Lớp 3: luật "góc" bắt buộc ----------
angle_rules: >
  Mỗi ý tưởng PHẢI có ít nhất một "góc": (a) phát hiện/số liệu mới 1-2 năm gần đây,
  (b) điều ngược suy nghĩ thông thường và có nguồn, hoặc (c) kết nối hai lĩnh vực
  tưởng như không liên quan. Thiếu góc thì loại. Cộng điểm nếu có điểm neo gần
  với người xem Việt (Việt Nam đứng ở đâu), nhưng KHÔNG bắt buộc so Việt–Hàn:
  chủ đề thế giới (khí hậu, năng lượng, thực phẩm, công nghệ, đời sống) có số
  liệu tốt được ưu tiên ngang — kênh không chỉ nói chuyện Việt Nam và Hàn Quốc.

# ---------- Lớp 4: số lượng mỗi ngày ----------
daily:
  raw_target: 30        # ~30 ý tưởng thô mỗi sáng
  shortlist: 3          # chọn ra 2-3 ý tưởng tốt nhất
  extra_script_tries: 2 # kịch bản hụt chuẩn thì viết thêm tối đa bấy nhiêu ý tưởng kế tiếp
  # --- chuỗi chạy hằng ngày (python -m src.daily) ---
  videos_per_day: 1     # số video dựng + gửi duyệt mỗi ngày
  utc_offset_hours: 9   # "mỗi ngày" tính theo giờ nơi Du ở (Hàn Quốc = +9)
  max_attempts: 2       # kịch bản đầu dựng hỏng thì thử kịch bản kế, tối đa bấy nhiêu lần
  max_script_age_days: 3   # kịch bản cũ hơn thế thì bỏ (số liệu "mới" đã nguội)
  min_script_words: 165    # lời đọc ít hơn thế (~48 giây) thì bỏ: video sẽ rớt Kiểm định độ dài
  min_script_numbers: 4    # lời đọc có ít con số hơn thế thì bỏ: video sẽ toàn cảnh chữ

# ---------- Nhạc nền (src/audio/music.py) ----------
# Chép nhạc vào assets/music/, tên file bắt đầu bằng nhóm: "calm - ...", "bright - ...",
# "serious - ...". Thư mục trống thì video không có nhạc.
music:
  enabled: true
  target_lufs: -27         # mỗi bài về độ to này (giọng ≈ -15); có giọng thì tự hạ thêm ~8 dB.
                           # Đo 12/11: nhạc dưới giọng ~25 dB lúc nói, ~17 dB ở khoảng nghỉ
  gain_db: -20             # dự phòng khi không đo được độ to của một bài
  max_uses_per_week: 3     # quá thì cảnh báo: kho nhạc nhóm đó cần thêm bài
  library: "YouTube Audio Library"   # ghi trong dòng "Nhạc nền: ..." của mô tả video
  license: "YouTube Audio Library — dùng trong video YouTube; mô tả luôn ghi công tên bài + tác giả"

# ---------- Nhịp video ----------
pacing:
  scene_seconds_min: 2     # đổi cảnh mỗi 2-4 giây
  scene_seconds_max: 4
  # Tốc độ đọc ĐO THẬT của giọng TTS (từ/giây, tính cả nghỉ giữa câu). Biên kịch dùng số
  # này để viết đủ dài: 60-90 giây ≈ 204-306 từ. Đổi giọng (TTS_VOICE) thì đo lại.
  words_per_second: 3.4

# ---------- Phân tích đối thủ (python -m src.analysis.competitors) ----------
competitor_analysis:
  months_back: 6          # chỉ xét video 6 tháng gần đây
  min_subs: 3000          # kênh quá nhỏ: số liệu nhiễu
  max_subs: 800000        # kênh quá to: thắng nhờ thương hiệu, khó học
  max_channels: 30
  outlier_ratio: 5.0      # view >= 5x trung vị kênh -> đột biến
  seed_queries:
    - {q: "giải thích ngắn kiến thức", lang: vi}
    - {q: "tại sao shorts khoa học", lang: vi}
    - {q: "số liệu thú vị shorts", lang: vi}
    - {q: "지식 쇼츠", lang: ko}
    - {q: "과학 상식 쇼츠", lang: ko}
    - {q: "data explained shorts", lang: en}
    - {q: "map chart explained shorts", lang: en}

# ---------- Trọng số chấm điểm của agent Biên tập ----------
# Agent Phân tích (giai đoạn 4) sẽ tự điều chỉnh các số này theo số liệu thật
scoring_weights:
  curiosity: 1.0        # độ tò mò
  novelty: 1.0          # độ mới
  verifiability: 1.0    # kiểm chứng được
  accessibility: 1.0    # ai cũng hiểu
  visualizability: 1.5  # dễ minh họa bằng biểu đồ/bản đồ -> quan trọng nhất với kênh này
  min_total: 17         # tổng điểm có trọng số tối thiểu để được chọn

# ---------- Luật chính sách (nhúng vào prompt của Biên kịch) ----------
policy_rules: >
  - Không viết như lời khuyên sức khỏe/tài chính/pháp lý; chỉ giải thích dữ liệu.
  - Không giật tít gây sợ hãi hay thao túng cảm xúc.
  - Mọi con số phải có nguồn kèm link.
  - Giọng văn tự nhiên, có quan điểm, không đọc đều đều như máy.

# ---------- Đăng bài (giai đoạn 4) ----------
publish:
  youtube:
    # manual: sau khi Du bấm Duyệt, bot gửi file gốc + tiêu đề/mô tả để Du tự đăng
    #         bằng app YouTube (~1 phút). An toàn, không cần Google duyệt gì.
    # api:    bot tự upload qua YouTube Data API. LƯU Ý: tài liệu chính thức của
    #         Google ghi video upload từ dự án API CHƯA qua "audit" sẽ bị khoá ở
    #         chế độ riêng tư -> chỉ bật "api" sau khi đã upload thử 1 video kiểm tra.
    mode: api                   # Du chốt 12/11/2026: bot tự upload sau khi Du bấm ✅
                                # (chưa cấp quyền YouTube thì tự lùi về gửi gói để Du tự đăng)
    privacy: public             # api: private | unlisted | public
    category_id: "27"           # 27 = Giáo dục
    made_for_kids: false
    contains_synthetic_media: true   # khai báo nội dung AI (giọng đọc AI) theo CLAUDE.md
    notify_subscribers: true
    # Hẹn giờ công khai (chỉ áp dụng mode api + privacy private). null = không hẹn.
    publish_time_local: "19:00" # giờ tối Việt Nam; null = công khai ngay khi upload
    utc_offset_hours: 7         # múi giờ của người xem chính (Việt Nam = +7)
    # App OAuth đã chuyển In production 12/11/2026 (chưa xác minh — không cần, chỉ Du dùng) -> hết
    # giới hạn token 7 ngày của chế độ Testing. Quay lại Testing thì đặt 7 để bot nhắc gia hạn.
    # Token hỏng vì lý do khác: bot tự gửi gói tự đăng và nhắc gửi /capquyen.
    oauth_token_days: null
  tiktok:
    # Đẩy video đã duyệt vào HỘP THƯ TikTok (bản nháp) — Du mở app, chạm thông báo, dán chú thích,
    # bật "Nội dung do AI tạo" rồi đăng. Cần TIKTOK_CLIENT_KEY/SECRET trong .env + gửi /tiktok cho bot
    # để kết nối; chưa có khoá thì bỏ qua trong im lặng.
    enabled: true
  hashtags_fixed: ["#thegioiquaconso", "#Shorts"]   # luôn có ở mọi video
  max_hashtags: 5               # YouTube bỏ qua toàn bộ hashtag nếu nhét quá nhiều
  disclosure: "Giọng đọc được tạo bằng AI. Số liệu được đối chiếu với nguồn trước khi đăng."
