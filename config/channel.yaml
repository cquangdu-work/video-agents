# ============================================================
# Cấu hình kênh "Thế giới qua con số"
# Đổi nguồn / trọng số ở đây, KHÔNG cần sửa code.
# ============================================================

channel:
  name: "Thế giới qua con số"
  language: vi
  description: >
    Kênh giải thích thế giới bằng dữ liệu: biểu đồ động, bản đồ,
    cuộc đua số liệu dựng bằng code. Ưu tiên góc Việt–Hàn khi phù hợp.
  video_seconds_min: 60
  video_seconds_max: 90

# ---------- Nguồn ý tưởng (lớp 1: lấy từ nguồn gốc) ----------
sources:
  rss:
    - name: "OWID Data Insights"
      url: "https://ourworldindata.org/atom-data-insights.xml"
      lang: en
      weight: 3          # nguồn hợp chủ đề nhất thì weight cao
    - name: "ScienceDaily Top"
      url: "https://www.sciencedaily.com/rss/top/science.xml"
      lang: en
      weight: 2
    - name: "ScienceDaily All"
      url: "https://www.sciencedaily.com/rss/all.xml"
      lang: en
      weight: 1
    - name: "Hankyoreh Science (Hàn)"
      url: "https://www.hani.co.kr/rss/science/"
      lang: ko
      weight: 2          # nguồn tiếng Hàn ít kênh Việt khai thác
    - name: "Donga Science (Hàn)"
      url: "https://rss.donga.com/science.xml"
      lang: ko
      weight: 2

  arxiv:
    categories: ["econ.GN", "physics.soc-ph", "cs.CY"]   # kinh tế, xã hội định lượng
    max_results: 15

  # Lưu ý: Reddit chặn truy cập JSON công khai (403) — cần đăng ký app API
  # chính thức (miễn phí) rồi thêm key vào .env ở bước sau. Hiện tại bỏ qua.
  reddit:
    subreddits: ["askscience", "explainlikeimfive", "dataisbeautiful"]
    listing: "top"
    time: "day"
    limit: 20

# ---------- Lớp 2: kiểm tra trùng ----------
dedup:
  title_similarity_threshold: 0.55   # trùng >55% từ khóa với ý tưởng cũ -> loại
  youtube_check:                     # cần YOUTUBE_API_KEY, không có thì bỏ qua
    max_results: 10
    high_view_threshold: 100000      # đã có video tiếng Việt >100k view -> phải có góc mới
    max_popular_allowed: 2

# ---------- Lớp 3: luật "góc" bắt buộc ----------
angle_rules: >
  Mỗi ý tưởng PHẢI có ít nhất một "góc": (a) phát hiện/số liệu mới 1-2 năm gần đây,
  (b) điều ngược suy nghĩ thông thường và có nguồn, hoặc (c) kết nối hai lĩnh vực
  tưởng như không liên quan. Thiếu góc thì loại. Cộng điểm nếu lồng được
  so sánh Việt Nam - Hàn Quốc.

# ---------- Lớp 4: số lượng mỗi ngày ----------
daily:
  raw_target: 30        # ~30 ý tưởng thô mỗi sáng
  shortlist: 3          # chọn ra 2-3 ý tưởng tốt nhất
  # --- chuỗi chạy hằng ngày (python -m src.daily) ---
  videos_per_day: 1     # số video dựng + gửi duyệt mỗi ngày
  utc_offset_hours: 9   # "mỗi ngày" tính theo giờ nơi Du ở (Hàn Quốc = +9)
  max_attempts: 2       # kịch bản đầu dựng hỏng thì thử kịch bản kế, tối đa bấy nhiêu lần
  max_script_age_days: 3   # kịch bản cũ hơn thế thì bỏ (số liệu "mới" đã nguội)
  min_script_words: 165    # lời đọc ít hơn thế (~48 giây) thì bỏ: video sẽ rớt Kiểm định độ dài

# ---------- Nhịp video ----------
pacing:
  scene_seconds_min: 2     # đổi cảnh mỗi 2-4 giây
  scene_seconds_max: 4
  # Tốc độ đọc ĐO THẬT của giọng TTS (từ/giây, tính cả nghỉ giữa câu). Biên kịch dùng số
  # này để viết đủ dài: 60-90 giây ≈ 204-306 từ. Đổi giọng (TTS_VOICE) thì đo lại.
  words_per_second: 3.4

# ---------- Phân tích đối thủ (python -m src.analysis.competitors) ----------
competitor_analysis:
  months_back: 6          # chỉ xét video 6 tháng gần đây
  min_subs: 3000          # kênh quá nhỏ: số liệu nhiễu
  max_subs: 800000        # kênh quá to: thắng nhờ thương hiệu, khó học
  max_channels: 30
  outlier_ratio: 5.0      # view >= 5x trung vị kênh -> đột biến
  seed_queries:
    - {q: "giải thích ngắn kiến thức", lang: vi}
    - {q: "tại sao shorts khoa học", lang: vi}
    - {q: "số liệu thú vị shorts", lang: vi}
    - {q: "지식 쇼츠", lang: ko}
    - {q: "과학 상식 쇼츠", lang: ko}
    - {q: "data explained shorts", lang: en}
    - {q: "map chart explained shorts", lang: en}

# ---------- Trọng số chấm điểm của agent Biên tập ----------
# Agent Phân tích (giai đoạn 4) sẽ tự điều chỉnh các số này theo số liệu thật
scoring_weights:
  curiosity: 1.0        # độ tò mò
  novelty: 1.0          # độ mới
  verifiability: 1.0    # kiểm chứng được
  accessibility: 1.0    # ai cũng hiểu
  visualizability: 1.5  # dễ minh họa bằng biểu đồ/bản đồ -> quan trọng nhất với kênh này
  min_total: 17         # tổng điểm có trọng số tối thiểu để được chọn

# ---------- Luật chính sách (nhúng vào prompt của Biên kịch) ----------
policy_rules: >
  - Không viết như lời khuyên sức khỏe/tài chính/pháp lý; chỉ giải thích dữ liệu.
  - Không giật tít gây sợ hãi hay thao túng cảm xúc.
  - Mọi con số phải có nguồn kèm link.
  - Giọng văn tự nhiên, có quan điểm, không đọc đều đều như máy.

# ---------- Đăng bài (giai đoạn 4) ----------
publish:
  youtube:
    # manual: sau khi Du bấm Duyệt, bot gửi file gốc + tiêu đề/mô tả để Du tự đăng
    #         bằng app YouTube (~1 phút). An toàn, không cần Google duyệt gì.
    # api:    bot tự upload qua YouTube Data API. LƯU Ý: tài liệu chính thức của
    #         Google ghi video upload từ dự án API CHƯA qua "audit" sẽ bị khoá ở
    #         chế độ riêng tư -> chỉ bật "api" sau khi đã upload thử 1 video kiểm tra.
    mode: manual
    privacy: private            # api: private | unlisted | public
    category_id: "27"           # 27 = Giáo dục
    made_for_kids: false
    contains_synthetic_media: true   # khai báo nội dung AI (giọng đọc AI) theo CLAUDE.md
    notify_subscribers: true
    # Hẹn giờ công khai (chỉ áp dụng mode api + privacy private). null = không hẹn.
    publish_time_local: null    # ví dụ "19:00"
    utc_offset_hours: 7         # múi giờ của người xem chính (Việt Nam = +7)
  hashtags_fixed: ["#thegioiquaconso", "#Shorts"]   # luôn có ở mọi video
  max_hashtags: 5               # YouTube bỏ qua toàn bộ hashtag nếu nhét quá nhiều
  disclosure: "Giọng đọc được tạo bằng AI. Số liệu được đối chiếu với nguồn trước khi đăng."
