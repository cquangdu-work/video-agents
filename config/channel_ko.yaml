publish:
  youtube:
    mode: api
    privacy: public
    category_id: "27"
    made_for_kids: false
    contains_synthetic_media: true
    notify_subscribers: true
    # Bình luận đầu tiên của kênh khi video công khai — một câu hỏi mời người xem trả lời (src/publish/first_comment.py,
    # Du đồng ý 26/11/2026). false = tắt.
    first_comment: true
    publish_time_local: "19:00"   # giờ tối Hàn Quốc
    # 2 video/ngày (24/11/2026): mỗi khung một video, khung sớm nhất còn trống (youtube.compute_publish_at)
    publish_times_local: ["12:00", "19:00"]
    utc_offset_hours: 9
    oauth_token_days: null
    playlists:                    # src/publish/playlists.py — xem chú thích ở config/channel.yaml
      # SERIES cố định (24/11/2026, playlists.SERIES): ý tưởng "이번 달 통계: …" / "한국 지도: …" vào danh sách riêng,
      # mô tả mở bằng tên series + hashtag + link danh sách
      thang-nay:
        title: "이번 달 통계"
        description: "통계청이 새로 발표한 이번 달 숫자를 발표 직후 지도와 그래프로 정리합니다. 출생아 수, 혼인 건수, 고용률, 물가까지."
      han-quoc:
        title: "지도로 보는 한국"
        description: "시도·시군구별 공식 통계(KOSIS)를 지도로 색칠했습니다. 우리 동네는 몇 위일까요?"
      ban-do:
        title: "세계 지도로 보는 숫자"
        description: "실제 데이터로 색칠한 세계 지도 — 한국은 세계 여러 나라 가운데 어디쯤일까요?"
      cuoc-dua:
        title: "숫자 순위 레이스"
        description: "해마다 순위가 뒤바뀌는 나라들 — 원본 데이터로 그린 순위 레이스."
      bieu-do:
        title: "한국과 일본, 숫자로 비교하기"
        description: "같은 지표로 본 한국과 일본의 수십 년 — 세계은행 데이터로 비교합니다."
      bai-bao:
        title: "과학 속 숫자"
        description: "발표된 연구 속 새로운 발견을 숫자로 풀어 드립니다."
      tong-hop:
        title: "숫자로 본 한 주"
        description: "한 주 동안의 데이터 이야기를 챕터별로 모은 영상."
  tiktok:
    # BẬT 21/11/2026 (Du: "đổi luôn"): tài khoản TikTok của Du (đăng ký ở Hàn, Target user của app Sandbox) chuyển từ
    # kênh Việt sang kênh Hàn. Vẫn là hộp thư: bot đẩy bản nháp, Du mở app dán chú thích + bật "AI" rồi đăng.
    # Token ở .secrets/tiktok_token.json của THƯ MỤC KÊNH HÀN (đã CHUYỂN từ kênh Việt, không chép — refresh token xoay vòng).
    enabled: true
  facebook:
    # Trang 숫자세계: Reel + bài viết mỗi ngày (Du bật 21/11/2026 — trước đó Trang chỉ để liên kết Instagram). Bài viết
    # DÙNG CHUNG với Instagram (một lần viết, một bản xem trước — review.prepare_ig_post).
    enabled: true
    page_id: null
    video_state: SCHEDULED      # hẹn giờ theo khung dưới đây
    publish_time_local: "19:00" # giờ dự phòng (giờ Hàn)
    # agent Facebook (src/fb_insights.py) THỬ các khung (giờ Hàn), Chủ nhật đo lượt phát/ngày, khung tốt dùng nhiều hơn
    slots: ["12:00", "19:00", "21:00"]
    utc_offset_hours: 9
    ai_generated: true          # nhãn "AI info" của Meta (giọng đọc AI)
    posts:
      enabled: true
      post_time_local: "11:30"  # giờ Hàn — trước bài Instagram 12:30
  instagram:
    # Reels lên Instagram (Du xin 20/11/2026), chỉ sau ✅. Kết nối: "/facebook <token>" cho bot kênh Hàn với Trang đã
    # liên kết tài khoản Instagram chuyên nghiệp, tích instagram_basic + instagram_content_publish.
    enabled: true
    publish_time_local: "19:00" # giờ Hàn — API không hẹn giờ được, bot tự đăng khi tới giờ
    publish_times_local: ["12:00", "19:00"]     # 2 Reel/ngày (24/11/2026), cùng khung với YouTube
    utc_offset_hours: 9
    ai_generated: true          # nhãn AI của Meta (giọng đọc AI)
    # BÀI VIẾT (ảnh 4:5 + chữ) mỗi ngày ngoài Reel (Du xin 21/11/2026): soạn lúc gửi duyệt (src/fb_post.py, cùng các
    # cổng kiểm số), xem trước dưới video, ✅ ở video là duyệt cả bài; bot đăng khi tới giờ.
    posts:
      enabled: true
      post_time_local: "12:30"  # giờ Hàn — giờ nghỉ trưa, lệch Reel 19:00 để trang có hai lần xuất hiện mỗi ngày
  hashtags_fixed: ["#숫자세계", "#Shorts"]
  max_hashtags: 5
  disclosure: "AI 음성으로 제작했습니다. 모든 수치는 게시 전에 출처와 대조했습니다."

