# ============================================================
# Cấu hình kênh TIẾNG HÀN "숫자세계" (Thế giới qua con số — bản Hàn), Du chốt mở 20/11/2026.
# Chạy bằng thư mục riêng trên VM (~/video-agents-ko) với CHANNEL_CONFIG=config/channel_ko.yaml trong .env
# của thư mục đó (src/lang.py). Dữ liệu, token, video, lịch chạy đều riêng — kênh Việt không bị ảnh hưởng.
# Mã kỳ hạn (`period`: tháng/tuần/ngày) và `per` giữ chữ Việt: đó là MÃ cho code, chữ hiện ra do code dịch.
# ============================================================

render:
  engine: web
  web_concurrency: 3
  intro: false

qc:
  min_seconds: 20
  max_seconds: 70

channel:
  name: "숫자세계"
  language: ko
  description: >
    데이터로 세상을 설명하는 채널: 코드로 만든 움직이는 그래프, 지도, 순위 경쟁.
    경제, 인구, 에너지, 기후, 생활 등 다양한 주제를 다루며 한국이 세계에서 어디쯤인지,
    일본·중국 등 이웃 나라와 비교해 보여 줍니다.
  video_seconds_min: 45
  video_seconds_max: 60

sources:
  rss:
    - name: "OWID Data Insights"
      url: "https://ourworldindata.org/atom-data-insights.xml"
      lang: en
      weight: 3
    - name: "ScienceDaily Top"
      url: "https://www.sciencedaily.com/rss/top/science.xml"
      lang: en
      weight: 2
  arxiv:
    categories: ["econ.GN", "physics.soc-ph", "cs.CY"]
    max_results: 10

  # World Bank: "한국 vs 일본" qua một con số. Nước đầu là "ta", nước sau là mốc so sánh.
  worldbank:
    per_day: 1
    start_year: 1960
    countries:
      - {iso3: KOR, iso2: KR, name: "한국"}
      - {iso3: JPN, iso2: JP, name: "일본"}
    indicators:
      - {code: NY.GDP.PCAP.CD,       name: "1인당 GDP",                  unit: "달러", period: tháng}
      - {code: SP.DYN.TFRT.IN,       name: "합계출산율",                  unit: "명"}
      - {code: SP.DYN.LE00.IN,       name: "기대수명",                    unit: "세"}
      - {code: SP.POP.65UP.TO.ZS,    name: "65세 이상 인구 비율",          unit: "%", per: người}
      - {code: IT.NET.USER.ZS,       name: "인터넷 이용자 비율",           unit: "%", per: người}
      - {code: SP.URB.TOTL.IN.ZS,    name: "도시 인구 비율",               unit: "%", per: người}
      - {code: NE.EXP.GNFS.ZS,       name: "GDP 대비 수출 비중",           unit: "%"}
      - {code: SL.UEM.TOTL.ZS,       name: "실업률",                      unit: "%", per: người lao động}
      - {code: SE.XPD.TOTL.GD.ZS,    name: "GDP 대비 공공 교육비",         unit: "%"}
      - {code: SH.XPD.CHEX.GD.ZS,    name: "GDP 대비 의료비 지출",         unit: "%"}
      - {code: GB.XPD.RSDV.GD.ZS,    name: "GDP 대비 연구개발비",          unit: "%"}
      - {code: SP.POP.TOTL,          name: "인구",                        unit: "만 명", scale: 10000}
      - {code: NY.GDP.MKTP.KD.ZG,    name: "경제성장률",                   unit: "%"}
      - {code: SL.TLF.CACT.FE.ZS,    name: "여성 경제활동 참가율",          unit: "%", per: phụ nữ}
      - {code: EG.USE.ELEC.KH.PC,    name: "1인당 전력 소비량",            unit: "kWh", period: ngày}
      - {code: SP.DYN.IMRT.IN,       name: "영아 사망률",                  unit: "명(출생아 1,000명당)"}
      - {code: FP.CPI.TOTL.ZG,       name: "소비자물가 상승률",             unit: "%"}
      - {code: NY.GDP.MKTP.CD,       name: "GDP 규모",                    unit: "억 달러", scale: 100000000}
      - {code: AG.LND.FRST.ZS,       name: "산림 면적 비율",               unit: "%"}
      - {code: SE.TER.ENRR,          name: "대학 취학률",                  unit: "%"}
      - {code: NV.IND.MANF.ZS,       name: "GDP 대비 제조업 비중",          unit: "%"}
      - {code: SL.AGR.EMPL.ZS,       name: "농업 종사자 비율",              unit: "%", per: người lao động}
    races:
      per_day: 1
      start_year: 1990
      year_step: 5
      focus: [KOR]
      countries:
        - {iso3: KOR, iso2: KR, name: "한국"}
        - {iso3: JPN, iso2: JP, name: "일본"}
        - {iso3: CHN, iso2: CN, name: "중국"}
        - {iso3: VNM, iso2: VN, name: "베트남"}
        - {iso3: THA, iso2: TH, name: "태국"}
        - {iso3: MYS, iso2: MY, name: "말레이시아"}
        - {iso3: IDN, iso2: ID, name: "인도네시아"}
        - {iso3: PHL, iso2: PH, name: "필리핀"}
        - {iso3: IND, iso2: IN, name: "인도"}
        - {iso3: SGP, iso2: SG, name: "싱가포르"}
      indicators:
        - {code: NY.GDP.PCAP.CD,    name: "1인당 GDP",             unit: "달러"}
        - {code: SP.DYN.LE00.IN,    name: "기대수명",               unit: "세"}
        - {code: IT.NET.USER.ZS,    name: "인터넷 이용자 비율",      unit: "%", start_year: 2000}
        - {code: EG.USE.ELEC.KH.PC, name: "1인당 전력 소비량",       unit: "kWh"}
        - {code: NY.GDP.MKTP.CD,    name: "GDP 규모",              unit: "억 달러", scale: 100000000}
        - {code: SP.URB.TOTL.IN.ZS, name: "도시 인구 비율",          unit: "%"}
    # Bản đồ thế giới THEO GÓC NHÌN HÀN QUỐC (Du chốt 20/11/2026): assets/geo/world_ko.json, Dokdo + 동해 tự vẽ
    # (src/render/geo.py). "한국은 세계 몇 위", so với Nhật Bản và trong OECD.
    world:
      per_day: 1
      start_year: 1990
      focus: [KOR, JPN]
      indicators: [SP.DYN.LE00.IN, NY.GDP.PCAP.CD, SP.DYN.TFRT.IN, IT.NET.USER.ZS, SP.POP.65UP.TO.ZS,
                   SP.URB.TOTL.IN.ZS, EG.USE.ELEC.KH.PC, SP.DYN.IMRT.IN, AG.LND.FRST.ZS, SL.TLF.CACT.FE.ZS,
                   SH.XPD.CHEX.GD.ZS, GB.XPD.RSDV.GD.ZS]

  # KOSIS: người nước ngoài cư trú tại Hàn Quốc theo quốc tịch (cuộc đua). Bảng "người Việt theo visa" của
  # kênh Việt không hợp khán giả Hàn nên không dùng.
  # province_map (24/11/2026): một chỉ số theo 17 시도 -> bản đồ Hàn Quốc theo tỉnh (src/sources/kosis.py,
  # assets/geo/kr_provinces.json). item = tên chỉ tiêu (khớp phần đầu), pick = chiều phụ chọn theo tên mục,
  # scale = nhân số (천원 -> 만원: 0.1), national: false = bỏ dòng 전국 (chỉ số mà cả nước luôn bằng 0).
  # Thêm bảng: tìm trên KOSIS bảng có chiều vùng với mục "서울특별시", chạy thử kosis.build_province_map.
  kosis:
    per_day: 1
    tables:
      - {kind: nationality_race, org: "111", tbl: DT_1B040A7, start: 2010, top: 10,
         org_name: "법무부", unit: "명", focus: [],
         name: "국적별 국내 체류 외국인"}
      - {kind: province_map, org: "101", tbl: DT_1B81A21, item: "합계출산율", name: "합계출산율", unit: "명"}
      - {kind: province_map, org: "101", tbl: DT_1YL20631, item: "고령인구비율", name: "고령인구 비율", unit: "%",
         per: người}
      - {kind: province_map, org: "101", tbl: INH_1C96_02, name: "1인당 지역내총생산", unit: "만원", scale: 0.1}
      - {kind: province_map, org: "101", tbl: DT_1YL21161, item: "1인가구비율", name: "1인 가구 비율", unit: "%"}
      - {kind: province_map, org: "101", tbl: DT_1YL20642, name: "청년 순이동률", unit: "%", national: false,
         pick: {B: "청년순이동률(19~39세)"}}
      # level: sgg (24/11/2026) — bản đồ ~229 시군구 (assets/geo/kr_sgg.json, ô phóng to Seoul): "우리 동네는 몇 위?"
      - {kind: province_map, level: sgg, org: "101", tbl: DT_1YL20631, item: "고령인구비율", name: "고령인구 비율",
         unit: "%", per: người}
      - {kind: province_map, level: sgg, org: "101", tbl: DT_1YL21161, item: "1인가구비율", name: "1인 가구 비율",
         unit: "%"}
      - {kind: province_map, level: sgg, org: "101", tbl: DT_1YL20642, name: "청년 순이동률", unit: "%",
         national: false, pick: {B: "청년순이동률(19~39세)"}}
    # SỐ MỚI CÔNG BỐ theo tháng (24/11/2026, kosis.build_monthly_map): kiểm MỖI NGÀY, tháng mới xuất hiện -> ý tưởng
    # "이번 달 통계" dựng trước mọi thứ khác. Lần đầu chỉ ghi mốc (state kosis_seen_*). map_value: yoy = bản đồ tô theo %
    # thay đổi so với cùng tháng năm trước (số đếm); không ghi = tô theo chính giá trị (tỷ lệ).
    monthly:
      - {org: "101", tbl: DT_1B8000G, name: "출생아 수", unit: "명", pick: {A: "출생아수(명)"}, map_value: yoy}
      - {org: "101", tbl: DT_1B8000G, name: "혼인 건수", unit: "건", pick: {A: "혼인건수(건)"}, map_value: yoy}
      - {org: "101", tbl: INH_1DA7014S_03, name: "고용률", unit: "%", pick: {B: "계"}}
      - {org: "101", tbl: DT_1YL20581, name: "소비자물가 상승률(전년 동월 대비)", unit: "%"}

  # Our World in Data — cuộc đua (race) và bản đồ thế giới (map, góc nhìn Hàn Quốc). Mỗi ngày 2 dòng liền nhau,
  # xếp xen kẽ map / race.
  owid:
    per_day: 2
    focus: [KOR]
    groups:
      major: [USA, CHN, JPN, DEU, GBR, FRA, IND, BRA, KOR, VNM]
    charts:
      - {slug: co-emissions-per-capita, kind: map, name: "1인당 이산화탄소 배출량", unit: "톤",
         origin: "Global Carbon Budget"}
      - {slug: electric-car-sales-share, kind: race, group: major, start_year: 2015, year_step: 2,
         name: "신차 판매 중 전기차 비율", unit: "%", origin: "국제에너지기구(IEA)", per: xe mới bán}
      - {slug: meat-supply-per-person, kind: map, name: "1인당 연간 육류 공급량", unit: "kg", origin: "FAO",
         period: tuần}
      - {slug: annual-working-hours-per-worker, kind: race, group: major,
         name: "근로자 1인당 연간 근로시간", unit: "시간", origin: "Penn World Table", period: tuần}
      - {slug: share-electricity-renewables, kind: map, name: "재생에너지 발전 비율", unit: "%",
         origin: "Ember, Energy Institute", per: số điện}
      - {slug: installed-solar-pv-capacity, kind: race, group: top, start_year: 2010,
         name: "태양광 발전 설비 용량", unit: "GW", origin: "IRENA"}
      - {slug: median-age, kind: map, name: "인구 중위연령", unit: "세", origin: "유엔 세계인구전망"}
      - {slug: annual-co2-emissions-per-country, kind: race, group: top, scale: 1000000,
         name: "연간 이산화탄소 배출량", unit: "백만 톤", origin: "Global Carbon Budget"}
      - {slug: pm25-air-pollution, kind: map, name: "연평균 초미세먼지(PM2.5) 농도", unit: "㎍/㎥",
         origin: "워싱턴대학교(세인트루이스)"}
      - {slug: per-capita-energy-use, kind: race, group: major,
         name: "1인당 에너지 소비량", unit: "kWh", origin: "Energy Institute", period: ngày}
      - {slug: share-of-adults-who-smoke, kind: map, name: "성인 흡연율", unit: "%",
         origin: "세계보건기구(WHO)", per: người trưởng thành}
      - {slug: coffee-bean-production, kind: race, group: top, scale: 1000,
         name: "커피 생산량", unit: "천 톤", origin: "FAO"}

  reddit:
    subreddits: []
    listing: "top"
    time: "day"
    limit: 20

dedup:
  title_similarity_threshold: 0.55
  youtube_check:
    max_results: 10
    high_view_threshold: 300000      # thị trường Hàn có nhiều kênh lớn hơn -> ngưỡng cao hơn kênh Việt
    max_popular_allowed: 2

angle_rules: >
  Mỗi ý tưởng PHẢI có ít nhất một "góc": (a) số liệu mới 1-2 năm gần đây, (b) điều ngược suy nghĩ
  thông thường và có nguồn, hoặc (c) kết nối hai lĩnh vực. Khán giả là NGƯỜI HÀN: cộng điểm khi có
  điểm neo Hàn Quốc (Hàn Quốc đứng thứ mấy, so với Nhật Bản / Trung Quốc / OECD), nhưng chủ đề thế
  giới có số liệu tốt được ưu tiên ngang.

daily:
  raw_target: 20
  # 2 video/ngày (Du chốt phương án A 24/11/2026): 2 kịch bản đạt/ngày đã có sẵn từ 20/11 (mỗi ngày bỏ phí 1),
  # Biên kịch 4-9/20 lượt gọi, TTS 1 lượt/video. Hai video cùng ngày phải KHÁC mảng và KHÁC dạng (daily.clashes),
  # đăng 12:00 + 19:00; bài viết ảnh Facebook/Instagram vẫn 1 bài/ngày (posts_per_day). Lùi về 1: sửa videos_per_day.
  shortlist: 3
  extra_script_tries: 1
  videos_per_day: 2
  posts_per_day: 1
  cadence_since: "2026-11-25"   # báo cáo tuần so trước/sau ngày đổi nhịp (growth.cadence_lines, luật lùi sau 2 tuần)
  utc_offset_hours: 9
  max_attempts: 2
  max_script_age_days: 3
  min_script_words: 24       # tiếng Hàn: "từ" = cụm (어절), ~1,1 cụm/giây -> 24 cụm ≈ 22 giây
  min_script_numbers: 4

music:
  enabled: true
  target_lufs: -27
  gain_db: -20
  max_uses_per_week: 3
  library: "YouTube Audio Library"
  license: "YouTube Audio Library — dùng trong video YouTube; mô tả luôn ghi công tên bài + tác giả"

pacing:
  scene_seconds_min: 2
  scene_seconds_max: 4
  # ĐO THẬT 20/11/2026 (giọng Kore, Gemini TTS, kịch bản 11 câu nhiều số): 75 cụm (어절) trong 73,7 giây =
  # 1,02 cụm/giây. Tiếng Hàn đọc số rất dài ("2024년" = 이천이십사년, "0.75명" = 영점칠오명): tính cả phần đọc số
  # thì ≈4,7 âm tiết/giây — tốc độ nói bình thường. Kịch bản ít số hơn đọc nhanh hơn chút -> lấy 1,1.
  words_per_second: 1.1
  words_per_scene: 4.5       # mỗi cảnh 3-5 cụm ≈ 3-5 giây (tiếng Việt: ~12 từ ≈ 3,5 giây)

style:
  experiments: true

community:
  enabled: true       # bật 24/11/2026: kênh có bình luận đầu tiên; nháp trả lời tiếng Hàn + bản dịch, Du ✅ mới đăng
  max_videos: 30
growth:
  ypp: {subs: 1000, watch_hours: 8000, shorts_views_90d: 20000000}

# ---------- CHỦ ĐỀ TUẦN cho video dài (src/themes.py, Du đồng ý 24/11/2026 sau bản phân tích xu hướng) ----------
# Tuần tính từ themes_start (Chủ nhật), xoay vòng danh sách. Trong tuần: bảng số của chủ đề lấy trước, ý tưởng/kịch bản
# khớp `words` được ưu tiên tới khi đủ theme_shorts Short; thứ Bảy video dài = các Short đó, tiêu đề = `title`.
# wb = mã World Bank, owid = slug OWID, kosis = bảng KOSIS ("DT_x" hoặc "DT_x:sgg"). Căn cứ chọn: quét YouTube 24/11.
longform:
  max_chapters: 8
  themes_start: "2026-11-22"
  theme_shorts: 4
  themes:
    - key: chulsan          # 출산율 반등: tin tức 0,9 triệu / 0,5 triệu lượt; số thật tháng 8/2026 +13%
      title: "출산율 반등, 진짜일까? 숫자로 본 한국의 출생과 결혼"
      words: ["출산", "출생", "혼인", "결혼"]
      wb: [SP.DYN.TFRT.IN]
      kosis: [DT_1B81A21]
    - key: jibang           # 지방소멸 dạng bản đồ: 34.000 lượt, gần như không ai làm
      title: "지도에서 사라지는 한국? 숫자로 본 지방소멸"
      words: ["고령", "65세", "순이동", "중위연령"]
      wb: [SP.POP.65UP.TO.ZS]
      kosis: ["DT_1YL20631:sgg", "DT_1YL20642:sgg", DT_1YL20631]
      owid: [median-age]
    - key: segye            # dạng xem nhiều nhất của kênh (3/3 video đầu bảng là bản đồ thế giới)
      title: "세계 지도로 본 한국, 한국은 몇 위일까?"
      words: ["세계 지도"]
      owid: [co-emissions-per-capita, share-electricity-renewables, pm25-air-pollution, median-age]
    - key: honja            # 1인 가구: trung vị 67.600 lượt
      title: "혼자 사는 한국, 1인 가구와 일자리를 숫자로 보다"
      words: ["1인 가구", "1인가구", "고용률", "실업률"]
      wb: [SL.UEM.TOTL.ZS]
      kosis: [DT_1YL21161, "DT_1YL21161:sgg"]

big_channels:
  # 24/11/2026: lượt đầu chỉ giữ được kênh hoạt hình tiếng Anh -> hạ ngưỡng (kênh số liệu tiếng Hàn nhỏ hơn), từ khoá
  # theo kiểu Shorts số liệu ở Hàn, chỉ giữ kênh đăng tiêu đề tiếng Hàn (big_channels.MIN_KOREAN)
  min_subs: 100000
  max_channels: 12
  outlier_ratio: 3.0
  watch_per_week: 4
  rediscover_days: 28
  # Ở Hàn gần như không có kênh Shorts số liệu >= 100k (quét 24/11) -> học cấu trúc từ các kênh số liệu kênh Việt đang
  # học: Mr Globee, Gosudarst, maxmaxdata (độ dài, nhịp đổi hình, kiểu mở đầu không phụ thuộc ngôn ngữ)
  seed_channels: [UC_que-CjOEPzrv6YMwBoWdQ, UC15gzmYSQKFj-misVqzZnZA, UC0nvCwGLmrKFZ6phJ19BoYQ]
  queries:
